name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Which parts of the repo did this change touch? ────────────────────────
  # PRs only run the jobs relevant to what they change. Pushes to main always
  # run everything. Editing this workflow counts as every area. Firmware jobs
  # join here once src/ exists.
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      pcb: ${{ github.event_name != 'pull_request' || steps.filter.outputs.pcb == 'true' }}
      firmware: ${{ github.event_name != 'pull_request' || steps.filter.outputs.firmware == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            pcb:
              - 'PCB/**'
              - 'ci/**'
              - 'scripts/spice/**'
              - 'scripts/layout_pcb.py'
              - 'manifest.kdl'
              - '.github/workflows/ci.yml'
            firmware:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  # ── Stackup hardware design ───────────────────────────────────────────────
  # The electrical design is PCB/stackup/board.kdl (Stackup KDL), not KiCad
  # schematics. This checks it with the Cargo-locked Stackup CLI (ci/stackup,
  # pinned with the parts library in manifest.kdl), verifies the purchasing BOM
  # resolves cleanly, and fails if syncing the committed PCB from the design
  # would change it, so the KDL and PCB/DroidPowerSense.kicad_pcb can't drift
  # apart.
  stackup:
    name: Stackup Design + PCB Sync
    needs: changes
    if: needs.changes.outputs.pcb == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Checkout Stackup KiCad plugin
        uses: actions/checkout@v7
        with:
          repository: stackup-eda/stackup
          ref: v0.3.0
          path: stackup-tool

      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Check Stackup design
        run: cargo +1.96.0 run --locked --manifest-path ci/stackup/Cargo.toml -- check PCB/stackup/board.kdl --locked

      - name: Check purchasing BOM
        run: cargo +1.96.0 run --locked --manifest-path ci/stackup/Cargo.toml -- bom PCB/stackup/board.kdl --locked -o /tmp/droidpowersense-bom.csv

      # Only what the sync check needs: pcbnew and its Python module (`kicad`) and the stock
      # footprints (`kicad-footprints`, in case the plugin has to load one). `--install-recommends`
      # also pulled in the 3D models (280 MB), demos and docs: 581 MB, mostly from Launchpad's PPA
      # at about 0.5 MB/s, and the 3D-model download timed out every few runs. A missing 3D model
      # is reported by the sync, not counted as a change. Retries ride out a dropped connection;
      # the timeout stops a hung download from holding the job for hours.
      #
      # ci/install_kicad.sh keeps apt's lists and .debs in ~/apt-cache and, when that cache is
      # recent, installs from it with no network: Launchpad and the Ubuntu mirrors are each slow
      # or down at times (see the script). The cache is saved after every run that changed it,
      # including one that failed or timed out, so a partial download is never thrown away.
      # Each save gets a new key (caches are immutable); restores take the newest by prefix.
      # A PR can restore main's cache, but main can't restore a PR's.
      # ImageOS is a runner environment variable, not in the `env` context.
      - name: Read runner image
        id: image
        run: echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"

      - name: Restore KiCad package cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-cache
          key: kicad-apt-${{ steps.image.outputs.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kicad-apt-${{ steps.image.outputs.os }}-

      - name: Install KiCad 10
        id: install
        timeout-minutes: 20
        run: ci/install_kicad.sh ~/apt-cache

      # A timed-out install leaves apt's download processes running, still writing to the cache
      # (tar then fails with "file changed as we read it" and nothing is saved): stop them first.
      # Half-downloaded files in partial/ stay; apt resumes them. apt also leaves root-owned files
      # the cache action can't read.
      - name: Prepare the package cache for saving
        if: always() && steps.cache.outcome == 'success' && steps.install.outputs.changed != 'false'
        run: |
          running() { pgrep -x apt-get || pgrep -f '^/usr/lib/apt/methods/'; } > /dev/null
          sudo pkill -x apt-get || true
          sudo pkill -f '^/usr/lib/apt/methods/' || true
          for _ in $(seq 10); do running || break; sleep 1; done
          sudo pkill -9 -x apt-get || true
          sudo pkill -9 -f '^/usr/lib/apt/methods/' || true
          sudo chown -R "$USER" ~/apt-cache

      - name: Save KiCad package cache
        if: always() && steps.cache.outcome == 'success' && steps.install.outputs.changed != 'false'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Check PCB sync
        run: |
          /usr/bin/python3 ci/check_pcb_sync.py PCB/DroidPowerSense.kicad_pcb \
            --stackup ci/stackup/target/debug/droidpowersense-stackup-check \
            --plugin-dir stackup-tool/kicad-plugin

  # ── Single required check ─────────────────────────────────────────────────
  # The one status check to require on main. Jobs above may be skipped when a
  # PR doesn't touch their area; this job always runs and fails if any job
  # failed or was cancelled (skipped counts as passing). Add every new job to
  # `needs` or it won't gate merges.
  ci-result:
    name: CI Result
    if: always()
    needs: [changes, stackup]
    runs-on: ubuntu-latest

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled."
            exit 1
          fi
